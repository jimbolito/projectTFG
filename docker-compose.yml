services:
  mongodb:
    image: mongo:5
    container_name: mongodb
    restart: always
    ports:
      - "27043:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  api-padel:
    build:
      context: ./api-padel
    container_name: api-padel
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - CHROME_BIN=/usr/bin/google-chrome
    volumes:
      - ./api-padel:/usr/src/app
    depends_on:
      - mongodb
    networks:
      - app-network

  webpadelapp:
    build:
      context: ./webpadelapp
    container_name: webpadelapp
    ports:
      - "4200:4200"
    volumes:
      - ./webpadelapp:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api-padel
    networks:
      - app-network

  cronicle:
    image: soulteary/cronicle
    container_name: cronicle
    restart: always
    ports:
      - "3012:3012"
    volumes:
      - cronicle-data:/opt/cronicle
    networks:
      - app-network

volumes:
  mongo-data:
  node_modules:
  cronicle-data:

networks:
  app-network:
    driver: bridge
